name: Deploy Vite ERP to DigitalOcean

on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Verify Required Secrets
              run: |
                  if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
                    echo "❌ SSH_PRIVATE_KEY secret is missing."
                    exit 1
                  fi

                  if [ -z "${{ secrets.DROPLET_IP }}" ]; then
                    echo "❌ DROPLET_IP secret is missing."
                    exit 1
                  fi

                  echo "✅ Required secrets are available."

            - name: Display Secret Diagnostics
              run: |
                  echo "SSH Key Length: ${#SSH_KEY}"
                  echo "Droplet IP Length: ${#HOST}"
              env:
                  SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  HOST: ${{ secrets.DROPLET_IP }}

            - name: Set Up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install Dependencies
              run: npm ci --legacy-peer-deps

            - name: Build Application
              run: npm run build

            - name: Deploy Files to DigitalOcean
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.DROPLET_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: 22
                  source: "dist/*"
                  target: "/var/www/web.erp"
                  strip_components: 1
                  overwrite: true

            - name: Set Permissions and Reload Nginx
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.DROPLET_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: 22
                  script: |
                      chown -R www-data:www-data /var/www/web.erp
                      chmod -R 755 /var/www/web.erp
                      nginx -t
                      systemctl reload nginx

            - name: Deployment Complete
              run: echo "🚀 Deployment completed successfully."
