name: Deploy Vite ERP to DigitalOcean

on:
    push:
        branches:
            - main # Triggers the deploy when you push to the main branch

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci --legacy-peer-deps

            - name: Build Application
              run: npm run build

            - name: Deploy to DigitalOcean Droplet via SFTP
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.DROPLET_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: 22
                  source: "dist/*"
                  target: "/var/www/web.erp"
                  strip_components: 1 # Flattens files directly into web.erp instead of making a /dist folder

            - name: Reset Permissions & Reload Nginx
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.DROPLET_IP }}
                  username: root
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: 22
                  script: |
                      sudo chown -R www-data:www-data /var/www/web.erp
                      sudo chmod -R 755 /var/www/web.erp
                      sudo systemctl reload nginx
